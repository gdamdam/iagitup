[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iagitup"
version = "3.7.0"
description = "Archive git repositories to the Internet Archive."
readme = { file = "README.md", content-type = "text/markdown" }
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Giovanni Damiola" }]
requires-python = ">=3.10"
keywords = ["github", "gitlab", "bitbucket", "gitea", "internetarchive", "archiving"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Version Control",
    "Topic :: System :: Archiving :: Backup",
]
dependencies = [
    "internetarchive>=3.0",
    "GitPython>=3.1",
    "requests>=2.28",
    "markdown2>=2.4",
]

[project.urls]
# PEP 753 well-known labels; PyPI shows the "GitHub Statistics" box for a
# github.com owner/repo URL and renders these with dedicated icons.
Homepage = "https://github.com/gdamdam/iagitup"
Source = "https://github.com/gdamdam/iagitup"
Issues = "https://github.com/gdamdam/iagitup/issues"
Changelog = "https://github.com/gdamdam/iagitup/blob/main/CHANGELOG.md"

[project.scripts]
iagitup = "iagitup.__main__:main"
archive-watchlist = "iagitup.archive_watchlist:main"

[tool.setuptools.packages.find]
include = ["iagitup*"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
# Keep agent worktrees and scratch imports out of local lint runs.
extend-exclude = [".claude", "to_import"]

[tool.ruff.lint]
# Pin the rule set explicitly: ruff's defaults grew in 0.17 (SIM, RUF, ...),
# which broke CI because the workflow installs the latest ruff.
select = ["E4", "E7", "E9", "F"]
